services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME_PREFIX:-safecell}-app
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8302}:80"
    environment:
      APP_NAME: ${APP_NAME:-SafeCell}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-base64:1vaU3dfc+sWjx8TuDXzginRsEa2dp2SBL+Ujs6QCb5c=}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8302}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-safecell}
      DB_USERNAME: ${DB_USERNAME:-safecell}
      DB_PASSWORD: ${DB_PASSWORD:-safecell123}
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: database
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - safecell-network

  mysql:
    image: mysql:8.0
    container_name: ${CONTAINER_NAME_PREFIX:-safecell}-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_DATABASE:-safecell}
      MYSQL_USER: ${DB_USERNAME:-safecell}
      MYSQL_PASSWORD: ${DB_PASSWORD:-safecell123}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./installation/backup/database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - safecell-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: ${CONTAINER_NAME_PREFIX:-safecell}-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - safecell-network

volumes:
  db_data:
  redis_data:
  storage_data:

networks:
  safecell-network:
    driver: bridge
